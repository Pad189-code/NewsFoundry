name: Backend CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        env:
          TEST_SQLITE: "1"
          DISABLE_RATE_LIMIT: "1"
          JWT_SECRET: "github-actions-ci-jwt-secret-at-least-32-chars!!"
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Railway
        run: |
          curl -X POST https://api.railway.app/graphql \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { deploymentCreate(input: {serviceId: \"63e2eca5-d394-4428-9c0e-7830eb031f0d\", source: {commitSha: \"${{ github.sha }}\"}}){deployment{id}}}"
            }'

