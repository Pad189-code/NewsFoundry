name: Backend CI

on:
  push:
  pull_request:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          working-directory: backend

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        env:
          TEST_SQLITE: "1"
          DISABLE_RATE_LIMIT: "1"
          JWT_SECRET: "github-actions-ci-jwt-secret-at-least-32-chars!!"
        run: uv run pytest -q
