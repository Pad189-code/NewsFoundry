name: Backend CI

on:
  push:
  pull_request:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  RAILWAY_GRAPHQL_URL: https://api.railway.app/graphql
  RAILWAY_SERVICE_ID: 63e2eca5-d394-4428-9c0e-7830eb031f0d

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        env:
          TEST_SQLITE: "1"
          DISABLE_RATE_LIMIT: "1"
          JWT_SECRET: "github-actions-ci-jwt-secret-at-least-32-chars!!"
        run: uv run pytest -q

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deploy NewsFoundry-api (GraphQL)
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail

          # Validation du token
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Secret RAILWAY_TOKEN manquant."
            echo "Créez un token projet : Railway → Projet → Settings → Tokens"
            exit 1
          fi

          # Fonction pour appeler GraphQL
          graphql() {
            local payload="$1"
            echo "DEBUG: Appel GraphQL vers $RAILWAY_GRAPHQL_URL"
            curl -fsS -X POST "$RAILWAY_GRAPHQL_URL" \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" || {
              echo "::error::Impossible de contacter l'API Railway."
              echo "Vérifiez : URL ($RAILWAY_GRAPHQL_URL), token, et connectivité réseau."
              exit 1
            }
          }

          echo "Commit à déployer : ${GITHUB_SHA}"
          echo "Service Railway : $RAILWAY_SERVICE_ID"

          # Résolution de l'Environment ID
          if [ -n "${RAILWAY_ENVIRONMENT_ID:-}" ]; then
            ENV_ID="$RAILWAY_ENVIRONMENT_ID"
            echo "Environment ID (secret) : $ENV_ID"
          else
            echo "RAILWAY_ENVIRONMENT_ID absent — résolution via l'API…"
            RESOLVE_PAYLOAD=$(jq -n \
              --arg serviceId "$RAILWAY_SERVICE_ID" \
              '{
                query: "query($serviceId: String!) { service(id: $serviceId) { name serviceInstances { edges { node { environmentId environment { name } } } } } }",
                variables: { serviceId: $serviceId }
              }')
            
            echo "DEBUG: Payload de résolution : $RESOLVE_PAYLOAD"
            RESOLVE_RESPONSE=$(graphql "$RESOLVE_PAYLOAD")
            echo "DEBUG: Réponse de résolution : $RESOLVE_RESPONSE"
            echo "$RESOLVE_RESPONSE" | jq .
            
            if echo "$RESOLVE_RESPONSE" | jq -e '.errors | length > 0' >/dev/null 2>&1; then
              echo "::error::Erreur GraphQL lors de la résolution de l'environnement."
              echo "$RESOLVE_RESPONSE" | jq '.errors'
              exit 1
            fi
            
            ENV_ID=$(echo "$RESOLVE_RESPONSE" | jq -r '
              .data.service.serviceInstances.edges
              | map(.node)
              | (map(select(.environment.name == "production"))[0] // .[0])
              | .environmentId // empty
            ')
            
            if [ -z "$ENV_ID" ]; then
              echo "::error::Aucun environmentId trouvé."
              echo "Ajoutez le secret RAILWAY_ENVIRONMENT_ID (Cmd+K → Copy Environment ID dans Railway)."
              exit 1
            fi
            echo "Environment ID (auto) : $ENV_ID"
          fi
          echo "environment_id=$ENV_ID" >> "$GITHUB_OUTPUT"

          # Déploiement
          DEPLOY_PAYLOAD=$(jq -n \
            --arg serviceId "$RAILWAY_SERVICE_ID" \
            --arg environmentId "$ENV_ID" \
            --arg commitSha "$GITHUB_SHA" \
            '{
              query: "mutation Deploy($serviceId: String!, $environmentId: String!, $commitSha: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha) }",
              variables: {
                serviceId: $serviceId,
                environmentId: $environmentId,
                commitSha: $commitSha
              }
            }')

          echo "DEBUG: Payload de déploiement : $DEPLOY_PAYLOAD"
          echo "Déclenchement serviceInstanceDeployV2…"
          DEPLOY_RESPONSE=$(graphql "$DEPLOY_PAYLOAD")
          echo "DEBUG: Réponse de déploiement : $DEPLOY_RESPONSE"
          echo "$DEPLOY_RESPONSE" | jq .

          if echo "$DEPLOY_RESPONSE" | jq -e '.errors | length > 0' >/dev/null 2>&1; then
            echo "::error::Mutation serviceInstanceDeployV2 refusée."
            echo "$DEPLOY_RESPONSE" | jq '.errors'
            exit 1
          fi

          DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | jq -r '.data.serviceInstanceDeployV2 // empty')
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
            echo "Déploiement créé : $DEPLOYMENT_ID"
          else
            echo "Déploiement déclenché (ID non renvoyé par l'API)."
          fi

      - name: Wait for Railway deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: ${{ steps.deploy.outputs.environment_id }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail

          graphql() {
            local payload="$1"
            curl -fsS -X POST "$RAILWAY_GRAPHQL_URL" \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload"
          }

          poll_by_deployment_id() {
            local id="$1"
            local payload
            payload=$(jq -n --arg id "$id" '{
              query: "query($id: String!) { deployment(id: $id) { id status staticUrl } }",
              variables: { id: $id }
            }')
            graphql "$payload"
          }

          poll_latest() {
            local payload
            payload=$(jq -n \
              --arg serviceId "$RAILWAY_SERVICE_ID" \
              --arg environmentId "$ENV_ID" \
              '{
                query: "query($serviceId: String!, $environmentId: String!) { deployments(first: 1, input: { serviceId: $serviceId, environmentId: $environmentId }) { edges { node { id status staticUrl } } } }",
                variables: { serviceId: $serviceId, environmentId: $environmentId }
              }')
            graphql "$payload"
          }

          echo "Attente du statut Railway (max ~25 min)…"
          for attempt in $(seq 1 100); do
            if [ -n "${DEPLOYMENT_ID:-}" ]; then
              RESPONSE=$(poll_by_deployment_id "$DEPLOYMENT_ID")
              STATUS=$(echo "$RESPONSE" | jq -r '.data.deployment.status // empty')
              URL=$(echo "$RESPONSE" | jq -r '.data.deployment.staticUrl // empty')
            else
              RESPONSE=$(poll_latest)
              STATUS=$(echo "$RESPONSE" | jq -r '.data.deployments.edges[0].node.status // empty')
              URL=$(echo "$RESPONSE" | jq -r '.data.deployments.edges[0].node.staticUrl // empty')
            fi

            echo "[$attempt/100] status=${STATUS:-unknown}${URL:+ url=$URL}"

            case "$STATUS" in
              SUCCESS)
                echo "✅ Déploiement Railway réussi."
                exit 0
                ;;
              FAILED|CRASHED|REMOVED)
                echo "::error::Déploiement Railway en échec (status=$STATUS)."
                echo "Voir le dashboard Railway → NewsFoundry-api."
                echo "$RESPONSE" | jq .
                exit 1
                ;;
              BUILDING|DEPLOYING|QUEUED|WAITING|INITIALIZING|"")
                sleep 15
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          echo "::error::Timeout en attendant la fin du déploiement Railway."
          exit 1

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "::error::Pipeline deploy échoué pour ${GITHUB_SHA} sur main."
          echo "Vérifiez :"
          echo "  1. RAILWAY_TOKEN (token projet, pas personnel)"
          echo "  2. RAILWAY_ENVIRONMENT_ID (optionnel mais recommandé)"
          echo "  3. Que le dépôt GitHub est bien connecté au service NewsFoundry-api"
          echo "  4. Les logs ci-dessus pour les erreurs GraphQL"

