name: Backend CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        env:
          TEST_SQLITE: "1"
          DISABLE_RATE_LIMIT: "1"
          JWT_SECRET: "github-actions-ci-jwt-secret-at-least-32-chars!!"
        run: uv run pytest -q
